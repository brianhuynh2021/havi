name: havi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: havi
      POSTGRES_PASSWORD: havi
      POSTGRES_DB: havi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U havi -d havi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API, matches HAVI_MEDIA_PUBLIC_URL in .env.example
      - "9001:9001" # Console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: create the havi-media bucket and allow public reads. The
  # media_public_url points directly to object URLs instead of presigned GETs.
  # This exits after setup and is not a long-running service.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/havi-media &&
      mc anonymous set download local/havi-media
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
