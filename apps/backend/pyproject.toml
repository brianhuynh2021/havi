[project]
name = "havi-backend"
version = "0.1.0"
description = "Havi backend — FastAPI API, Celery worker, Celery Beat scheduler"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
# Cài khi bắt đầu nối DB / hàng đợi thật (xem docs/architecture/SYSTEM_ARCHITECTURE.md)
queue = [
    "celery[redis]>=5.4",
]
db = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "domain", "adapters", "application", "worker", "scheduler"]

[tool.ruff]
line-length = 100
target-version = "py312"
# File autogenerate của Alembic không theo style project — không lint.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
