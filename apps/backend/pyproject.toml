[project]
name = "havi-backend"
version = "0.1.0"
description = "Havi backend — FastAPI API, Celery worker, Celery Beat scheduler"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # [email] cho EmailStr — validate email ngay ở tầng contract, không tự viết regex.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    # Argon2 thay vì bcrypt/passlib: passlib cần module `crypt` đã bị xoá ở
    # Python 3.13+, và bcrypt truncate âm thầm ở 72 bytes — mật khẩu tiếng Việt
    # có dấu ăn ~3 bytes/ký tự nên chạm giới hạn đó chỉ sau ~24 ký tự.
    "argon2-cffi>=23.1",
    # Fernet (AES-128-CBC + HMAC) để mã hoá token OAuth nền tảng trước khi lưu
    # DB. Không tự ghép AES: Fernet đã gói sẵn IV ngẫu nhiên, HMAC chống sửa và
    # timestamp — ba thứ dễ làm sai nhất khi tự cuộn.
    "cryptography>=44.0",
    # Gọi Graph API của Facebook. Là dependency chính chứ không phải dev: adapter
    # publish dùng ở runtime, để trong [dev] thì production crash lúc import.
    "httpx>=0.27",
    # Rate limit dùng Redis, và nó chạy trong API process — không nằm trong extra
    # `queue` (Celery) vì API không cần cài Celery mới khởi động được. Counter
    # phải nằm ngoài process: in-memory thì mỗi worker uvicorn đếm riêng và
    # restart là mất, tức không giới hạn được gì.
    "redis>=5.2",
    # Official PayOS SDK cho xử lý thanh toán VietQR & Webhook chuẩn xác
    "payos>=1.1.0",
]

[project.optional-dependencies]
# Cài khi bắt đầu nối DB / hàng đợi thật (xem docs/architecture/SYSTEM_ARCHITECTURE.md)
queue = [
    "celery[redis]>=5.4",
]
db = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]
storage = [
    # boto3 sync là đủ: generate_presigned_post chỉ ký local (HMAC), không gọi
    # network, nên chạy trong async endpoint không block event loop.
    "boto3>=1.35",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "domain", "adapters", "application", "worker", "scheduler"]

[tool.ruff]
line-length = 100
target-version = "py312"
# File autogenerate của Alembic không theo style project — không lint.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
