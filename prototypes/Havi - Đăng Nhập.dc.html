<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Havi — Đăng Nhập &amp; Đăng Ký</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #07090E;
  --panel-bg: rgba(15, 23, 42, 0.7);
  --panel-border: rgba(255, 255, 255, 0.1);
  --primary-accent: #6366F1;
  --text-main: #F8FAFC;
  --text-sub: #94A3B8;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-dark);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: #A5B4FC; text-decoration: none; }
a:hover { color: #fff; text-decoration: underline; }

.bg-grid-pattern {
  background-size: 40px 40px;
  background-image: 
    linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
}

.glass-card {
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  border-radius: 24px;
}

.input-antigravity {
  background: rgba(10, 14, 24, 0.7);
  border: 1.5px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 15px;
  color: #fff;
  outline: none;
  width: 100%;
  transition: all 0.25s ease;
}
.input-antigravity:focus {
  border-color: #6366F1;
  box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
}

.btn-antigravity {
  background: linear-gradient(135deg, #6366F1 0%, #4F46E5 50%, #4338CA 100%);
  color: #fff !important;
  border-radius: 12px;
  padding: 14px;
  font-weight: 700;
  font-size: 16px;
  box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.15);
  cursor: pointer;
  width: 100%;
  transition: all 0.25s ease;
}
.btn-antigravity:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 35px rgba(99, 102, 241, 0.6);
}
</style>
</helmet>

<div class="bg-grid-pattern" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;position:relative;">
  
  <!-- Glowing background orbs -->
  <div style="position:absolute;top:10%;left:20%;width:400px;height:400px;background:radial-gradient(circle, rgba(139,92,246,0.2) 0%, transparent 70%);filter:blur(80px);pointer-events:none;"></div>
  <div style="position:absolute;bottom:10%;right:20%;width:400px;height:400px;background:radial-gradient(circle, rgba(6,182,212,0.15) 0%, transparent 70%);filter:blur(80px);pointer-events:none;"></div>

  <!-- Header Logo & Lang Switcher -->
  <div style="display:flex;align-items:center;justify-content:space-between;width:100%;max-width:440px;margin-bottom:28px;">
    <a href="Havi - Landing Page.dc.html" style="display:flex;align-items:center;gap:12px;">
      <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(99,102,241,0.5);">
        <svg width="22" height="22" viewBox="0 0 40 40"><path d="M13 11v18M27 11v18M13 20h14" stroke="#fff" stroke-width="3.8" stroke-linecap="round"></path><circle cx="27" cy="11" r="3.2" fill="#A5B4FC"></circle></svg>
      </div>
      <span style="font-weight:800;font-size:22px;color:#fff;">Havi</span>
    </a>

    <button style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:99px;padding:6px 14px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;">
      🇻🇳 VN | 🇬🇧 EN
    </button>
  </div>

  <!-- Main Card -->
  <div class="glass-card" style="width:100%;max-width:440px;padding:40px 36px;position:relative;z-index:2;">

    <sc-if value="{{ vLogin }}" hint-placeholder-val="{{ true }}">
      <div>
        <h1 style="margin:0;font-weight:800;font-size:24px;text-align:center;color:#fff;">Chào bạn trở lại ✨</h1>
        <p style="margin:8px 0 0;font-size:14.5px;color:#94A3B8;text-align:center;">Đăng nhập để tiếp tục cùng Havi AI Studio.</p>
        
        <div style="display:flex;flex-direction:column;gap:18px;margin-top:28px;">
          <label style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;font-weight:600;color:#E2E8F0;">Email tiệm của bạn
            <input value="{{ email }}" onChange="{{ setEmail }}" type="email" placeholder="tencuaban@gmail.com" class="input-antigravity"></input>
          </label>

          <label style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;font-weight:600;color:#E2E8F0;">Mật khẩu
            <input value="{{ pass }}" onChange="{{ setPass }}" type="password" placeholder="••••••••" class="input-antigravity"></input>
          </label>

          <button onClick="{{ goForgot }}" style="align-self:flex-end;background:none;border:none;padding:0;font-size:13px;font-weight:600;color:#A5B4FC;cursor:pointer;">Quên mật khẩu?</button>

          <a href="Havi - MVP App.dc.html" class="btn-antigravity" style="text-align:center;display:block;">Đăng Nhập Ngay</a>
        </div>

        <div style="display:flex;align-items:center;gap:12px;margin-top:24px;">
          <span style="flex:1;height:1px;background:rgba(255,255,255,0.1);"></span>
          <span style="font-size:12px;color:#64748B;">hoặc</span>
          <span style="flex:1;height:1px;background:rgba(255,255,255,0.1);"></span>
        </div>

        <button onClick="{{ loginGoogle }}" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);color:#fff;border-radius:12px;padding:14px 0;font-weight:700;font-size:15px;cursor:pointer;margin-top:18px;">
          <span style="width:22px;height:22px;border-radius:6px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;">G</span>
          Tiếp tục với Google
        </button>

        <div style="border-top:1px solid rgba(255,255,255,0.08);margin-top:24px;padding-top:20px;text-align:center;">
          <p style="margin:0;font-size:14.5px;color:#94A3B8;">Chưa có tài khoản Havi? <button onClick="{{ goSignup }}" style="background:none;border:none;padding:0;font-size:14.5px;font-weight:700;color:#6366F1;cursor:pointer;">Tạo tài khoản miễn phí</button></p>
        </div>
      </div>
    </sc-if>

  </div>

  <div style="margin-top:24px;font-size:13px;color:#64748B;">
    © 2026 Havi Platform. Antigravity AI Security Compliance.
  </div>

</div>
</x-dc>
</body>
</html>
