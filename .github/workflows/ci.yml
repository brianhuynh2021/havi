name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  web:
    name: Web Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Web
        run: npm run lint:web

      - name: Test Web
        run: npm run test:web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual and Accessibility Smoke
        run: npm run test:visual

      # Ảnh thật CI render ra, kèm cả ảnh "-actual" khi lệch. Baseline sinh trên
      # macOS luôn lệch 2-6% so với Linux vì antialiasing font khác nhau, mà
      # ngưỡng là 1% — nên không thể xác nhận baseline từ máy dev. Artifact này
      # là cách lấy được đúng ảnh của môi trường gác cổng.
      #
      # `if: failure()` — chỉ tải lên khi có gì để xem, không đốt storage mỗi lần
      # CI xanh.
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Build Web
        run: npm run build:web

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: havi
          POSTGRES_PASSWORD: havi
          POSTGRES_DB: havi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      HAVI_ENV: local
      HAVI_DEBUG: "true"
      HAVI_DATABASE_URL: postgresql+psycopg://havi:havi@localhost:5432/havi
      HAVI_REDIS_URL: redis://localhost:6379/0
      HAVI_JWT_SECRET: ci-jwt-secret-key-must-be-at-least-32-bytes-long
      HAVI_TOKEN_ENCRYPTION_KEY: Z3A5T2I3NTRLN3Y4OTAxMjM0NTY3ODkwMTIzNDU2Nzg=
      HAVI_USE_MOCK_LLM: "true"

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra db --extra queue --extra storage

      # tests/test_video_ingestion.py builds real clips with `ffmpeg testsrc`
      # and reads them back with ffprobe. Without the binaries those tests skip,
      # so the whole video ingestion path would have zero CI coverage while
      # still reporting green.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Ruff Check
        run: uv run ruff check .

      - name: Alembic Migration Check
        run: uv run alembic upgrade head

      # Catches model/migration drift, not just "migrations apply". This was
      # broken for a long time: `domain/models/__init__.py` never imported the
      # content models, so the command crashed instead of comparing.
      - name: Alembic Drift Check
        run: uv run alembic check

      - name: Start MinIO
        run: |
          docker run -d --name havi-ci-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/live; then
              break
            fi
            if [ "$i" = "30" ]; then
              docker logs havi-ci-minio
              exit 1
            fi
            sleep 2
          done
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest \
            -c "mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb --ignore-existing local/havi-media && mc anonymous set download local/havi-media"

      - name: Run Pytest
        run: uv run pytest

      # The committed TypeScript client is generated from this backend, but
      # nothing verified it stayed in sync. It had drifted far enough to still
      # declare /crm-messages and /leads/{id}/messages, endpoints the backend
      # does not serve. Regenerate here and fail on any diff.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: OpenAPI Client Drift Check
        run: |
          uv run python scripts/export_openapi.py > ../web/openapi.json
          npx --yes openapi-typescript@7 ../web/openapi.json \
            -o ../web/src/lib/api-client/schema.d.ts
          git diff --exit-code -- ../web/src/lib/api-client/schema.d.ts \
            || { echo "::error::schema.d.ts is stale — run 'npm run generate:api' and commit"; exit 1; }

  security:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Quét môi trường đã sync, không quét file requirements: chế độ
      # `--requirement` của pip-audit tự dựng một venv riêng để resolve, và bước
      # đó hỏng ở nhiều môi trường CI. Sync rồi quét đúng những gì đã cài vừa
      # chắc chắn hơn vừa phản ánh đúng phiên bản chạy thật.
      #
      # `--skip-editable` bỏ qua chính `havi-backend` (không có trên PyPI nên
      # không thể tra CVE). Không dùng `--strict`: nó coi lần skip đó là lỗi và
      # làm CI đỏ vĩnh viễn. Lỗ hổng thật vẫn làm pip-audit trả exit code khác 0.
      - name: Audit Python dependencies
        working-directory: apps/backend
        run: |
          uv sync --extra dev --extra db --extra queue --extra storage
          uv run --with pip-audit pip-audit --skip-editable

      # `--omit=dev`: lỗ hổng trong test runner không đi ra production, và để nó
      # làm đỏ CI thì cảnh báo thật sẽ bị bỏ qua vì quen. `--audit-level=high`
      # cùng lý do — chặn ở mức đáng chặn.
      - name: Audit Node dependencies
        run: npm audit --omit=dev --audit-level=high
