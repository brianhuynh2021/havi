# Sinh lại baseline ảnh Playwright TRÊN LINUX rồi tải lên làm artifact.
#
# Vì sao cần một workflow riêng thay vì sinh ở máy dev: baseline sinh trên macOS
# lệch 2-6% so với Linux vì antialiasing font khác nhau, mà ngưỡng so sánh là 1%.
# `snapshotPathTemplate` trong playwright.config.ts không có `{platform}`, nghĩa
# là chỉ tồn tại MỘT bộ baseline — và bộ đó phải là bộ của môi trường gác cổng,
# tức CI.
#
# Cách chạy:
#
# - `workflow_dispatch` (Actions → "Update Visual Baselines" → Run workflow) chỉ
#   dùng được khi file này đã có trên **default branch** (`main`) — GitHub đọc
#   danh sách workflow chạy tay từ đó. `dev` đang đi trước `main` 250 commit nên
#   tạm thời chưa gọi được cách này.
#
# - Trong lúc đó: đẩy một commit chạm vào chính file này hoặc vào baseline. Đó là
#   lý do có `push.paths` — nó khiến workflow gọi được từ `dev` mà không phải
#   merge sang `main` trước, và cũng không chạy ở mọi commit thường.
#
# Xong thì tải artifact `visual-baselines-linux`, giải nén vào
# `apps/web/e2e/__screenshots__/` rồi commit.
name: Update Visual Baselines

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-visual-baselines.yml"
      - "apps/web/e2e/__screenshots__/**"

jobs:
  regenerate:
    name: Regenerate baselines on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # `--update-snapshots` ghi lại toàn bộ baseline. `|| true` vì Playwright
      # trả exit code khác 0 ở lần ghi đầu (không có baseline để so), mà đó là
      # kết quả mong đợi ở đây chứ không phải lỗi.
      - name: Regenerate snapshots
        working-directory: apps/web
        run: npx playwright test --update-snapshots || true

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: apps/web/e2e/__screenshots__/
          retention-days: 7

# Chạm file để kích hoạt workflow: sinh lại baseline sau khi chuyển sang Material 3.

# Chạm file: sinh lại baseline sau đợt dọn gradient/glow ở các màn hình.
